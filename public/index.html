<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIC Trainer — Synthetic Scenario</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">SIC TRAINER · FOUNDATION SLICE</p>
      <h1>Synthetic Team Handoff</h1>
      <p class="notice">This fictional exercise contains no real-world aircraft procedures.</p>
      <section class="card"><h2>Current state</h2><p id="state" class="state"></p><div id="actions" class="actions" aria-label="Available actions"></div><p id="error" class="error" role="alert"></p></section>
      <section class="card"><h2>Deterministic score</h2><p id="score" class="score"></p><ul id="score-items"></ul></section>
      <section class="card"><h2>Session event log</h2><ol id="events" class="events"></ol></section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
